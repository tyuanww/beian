name: quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-powershell-contract:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Windows PowerShell 5.1 atomic replace contract
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne "Desktop" -or $PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1 Desktop, got $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"
          }

          $testRoot = Join-Path ([System.IO.Path]::GetTempPath()) ("beian-file-replace-" + [Guid]::NewGuid().ToString("N"))
          [System.IO.Directory]::CreateDirectory($testRoot) | Out-Null
          try {
            $source = Join-Path $testRoot "source.txt"
            $destination = Join-Path $testRoot "destination.txt"
            [System.IO.File]::WriteAllText($source, "new")
            [System.IO.File]::WriteAllText($destination, "old")

            [System.IO.File]::Replace(
              $source,
              $destination,
              [System.Management.Automation.Language.NullString]::Value
            )

            if ([System.IO.File]::ReadAllText($destination) -ne "new") {
              throw "Atomic replacement did not update the destination"
            }
            if (Test-Path -LiteralPath $source) {
              throw "Atomic replacement left the source file behind"
            }
          } finally {
            if (Test-Path -LiteralPath $testRoot) {
              Remove-Item -LiteralPath $testRoot -Recurse -Force
            }
          }
      - name: Verify Illustrator agent scheduled-task contract
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSEdition -ne "Desktop" -or $PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1 Desktop, got $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"
          }
          & (Join-Path $env:GITHUB_WORKSPACE "scripts\windows\illustrator-agent-task.contract.ps1")
          & (Join-Path $env:GITHUB_WORKSPACE "scripts\windows\illustrator-agent-watchdog.contract.ps1")
          & (Join-Path $env:GITHUB_WORKSPACE "scripts\windows\monitor-task.contract.ps1")
      - name: Verify offline dependency handoff contract (synthetic temp repo only)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & (Join-Path $env:GITHUB_WORKSPACE "scripts\windows\release-deps-handoff.contract.ps1")
      - name: Rehearse full pre-stop dependency staging (temp clone, real release functions loaded by AST)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & (Join-Path $env:GITHUB_WORKSPACE "scripts\windows\release-staging-rehearsal.ps1")
      - name: Set up Node for GLB WebP conversion check
        uses: actions/setup-node@v4
        with:
          # Production Windows runs Node 20 LTS (scripts/windows/README.md, docs/adr-001-frontend-stack.md).
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Real npm ci + GLB WebP conversion of a small test GLB (Windows natives)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed exit=$LASTEXITCODE" }
          Push-Location (Join-Path $env:GITHUB_WORKSPACE "apps\web\server")
          try {
            & (Join-Path $env:GITHUB_WORKSPACE "node_modules\.bin\tsx.cmd") "src\glbWebpProbe.ts"
            if ($LASTEXITCODE -ne 0) { throw "GLB WebP probe failed exit=$LASTEXITCODE" }
            # Synthetic GLB with the real mockup texture layout (no customer data); logs peak RSS.
            & (Join-Path $env:GITHUB_WORKSPACE "node_modules\.bin\tsx.cmd") "src\glbWebpMemoryProbe.ts"
            if ($LASTEXITCODE -ne 0) { throw "GLB WebP memory probe failed exit=$LASTEXITCODE" }
          } finally {
            Pop-Location
          }
      - name: GLB WebP variant rename-while-open + directory fsync best-effort (Windows semantics)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location (Join-Path $env:GITHUB_WORKSPACE "apps\web\server")
          try {
            # Synthetic temp dirs only. Old handle must keep reading the full old variant after unlink/rename;
            # directory fsync may fail on Windows (EISDIR/EPERM) and must stay best-effort, never throw.
            & (Join-Path $env:GITHUB_WORKSPACE "node_modules\.bin\tsx.cmd") --test "src\glb-webp-variant-rename-open.test.ts" "src\glb-webp-variant-fsync.test.ts" "src\glb-webp-variant-windows-replace.test.ts"
            if ($LASTEXITCODE -ne 0) { throw "GLB WebP variant Windows fs tests failed exit=$LASTEXITCODE" }
          } finally {
            Pop-Location
          }

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history for baseline comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/quality/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/web/backend/requirements.txt
            apps/web/backend/requirements-quality.txt

      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix tools/quality

      - name: Repair npm optional Rollup native on Linux
        run: |
          if ! node -e "try { require.resolve('@rollup/rollup-linux-x64-gnu', { paths: ['./apps/web/ui'] }); } catch { process.exit(1); }"; then
            rollup_native_version="$(node -p "require('./apps/web/ui/node_modules/rollup/package.json').version")"
            npm install --prefix apps/web/ui --no-save --package-lock=false --ignore-scripts \
              "@rollup/rollup-linux-x64-gnu@${rollup_native_version}"
          fi

      - name: Install Python and quality dependencies
        run: |
          python -m venv apps/web/backend/.venv
          apps/web/backend/.venv/bin/python -m pip install --disable-pip-version-check \
            -r apps/web/backend/requirements.txt \
            -r apps/web/backend/requirements-quality.txt

      - name: Test quality contracts
        run: npm run test:quality

      - name: Enforce monotonic quality baseline
        if: github.event_name == 'pull_request'
        run: npm run quality -- --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: Run quality checks
        if: github.event_name != 'pull_request'
        run: npm run quality

      - name: Run strict type and UI build checks
        run: npm run typecheck

      - name: Run complete L0 suite
        env:
          PYTEST_ADDOPTS: "--durations=20"
        run: npm test
